[project]
name = "standup-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.2",
    "jinja2>=3.1.6",
    "openai>=3.55.0",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
